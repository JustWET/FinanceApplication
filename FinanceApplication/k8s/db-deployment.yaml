apiVersion: apps/v1
kind: Deployment

metadata:
  name: db-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
      - name: sql-server

        image: mcr.microsoft.com/mssql/server:2022-latest

        ports:
        - containerPort: 1433

        env:
        - name: ACCEPT_EULA
          value: "Y"

        - name: SA_PASSWORD
          value: "MyStrong!Pass123"

        volumeMounts:
        - name: sql-storage
          mountPath: /var/opt/mssql

      volumes:
      - name: sql-storage
        emptyDir: {}