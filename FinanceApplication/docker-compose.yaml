version: '3.9'

services:
  blazor:
    build:
      context: .
      dockerfile: FinanceApp.Blazor/dockerfile
    ports:
      - "7038:8080"
    depends_on:
      - api
    networks:
    - app-network

  api:
    build:
      context: .
      dockerfile: PersonalFinanceDataManager.Core/dockerfile
    ports:
      - "7004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=FinanceAppDb;User=sa;Password=MyStrong!Pass123;Encrypt=false;TrustServerCertificate=True;Integrated Security=False;
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "MyStrong!Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
    - app-network

volumes:
  sql_data:

networks:
  app-network:
